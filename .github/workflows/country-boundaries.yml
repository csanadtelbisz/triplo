name: Prepare country boundaries

on:
  push:
    branches: [feat/country-analytics]
    paths: ['scripts/boundaries/**', '.github/workflows/country-boundaries.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/boundaries/requirements.txt
      - run: pip install -r scripts/boundaries/requirements.txt
      - run: python scripts/boundaries/boundaries.py build
      - uses: actions/upload-artifact@v4
        with:
          name: country-boundaries
          path: |
            frontend/public/countries
            scripts/boundaries/source.lock.json
          retention-days: 7
