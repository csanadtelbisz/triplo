name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

# Pages has one deployment per repository. Publish production and all open previews.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.matrix }}
    steps:
      - name: Find production and open pull requests
        id: sites
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: production } = await github.rest.repos.getCommit({
              owner, repo, ref: repository.default_branch,
            });
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const include = [{ name: 'production', ref: production.sha, path: '', preview: false }];
            for (const pull of pulls) {
              // Fork code never runs in this publishing workflow.
              if (pull.head.repo?.full_name !== `${owner}/${repo}`) continue;
              include.push({
                name: `pr-${pull.number}`, ref: pull.head.sha,
                path: `pr-preview/pr-${pull.number}/`, preview: true,
              });
            }
            core.setOutput('matrix', JSON.stringify({ include }));

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Type-check production deployments
        if: ${{ !inputs.preview }}
        run: npm exec -- tsc -b
        working-directory: frontend
      # PR validation type-checks separately. Production may predate PR tooling.
      - name: Build site
        run: npm exec vite build -- --base="$SITE_BASE"
        working-directory: frontend
        env:
          SITE_BASE: /${{ github.event.repository.name }}/${{ matrix.path }}
          VITE_GOOGLE_CLIENT_ID: ${{ !matrix.preview && secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          VITE_GOOGLE_DRIVE_API_KEY: ${{ !matrix.preview && secrets.VITE_GOOGLE_DRIVE_API_KEY || '' }}
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.name }}
          path: frontend/dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.preview && 'pull-request-previews' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built sites
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: sites
      - name: Assemble production and previews
        run: |
          mkdir -p public/pr-preview
          cp -a sites/site-production/. public/
          for preview in sites/site-pr-*; do
            [ -d "$preview" ] || continue
            name="${preview##*/site-}"
            mkdir -p "public/pr-preview/$name"
            cp -a "$preview/." "public/pr-preview/$name/"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Write deployment links
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Production: $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
          for preview in public/pr-preview/pr-*; do
            [ -d "$preview" ] || continue
            echo "Preview: ${PAGES_URL%/}/pr-preview/${preview##*/}/" >> "$GITHUB_STEP_SUMMARY"
          done
