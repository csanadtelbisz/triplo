<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
  <defs>
    <mask id="trolleybus-cutouts" maskUnits="userSpaceOnUse" x="0" y="-960" width="960" height="960">
      <rect x="0" y="-960" width="960" height="960" fill="white"/>
      <rect x="120" y="-550" width="180" height="130" fill="black"/>
      <rect x="400" y="-550" width="180" height="130" fill="black"/>
      <rect x="680" y="-550" width="120" height="240" fill="black"/>
      <circle cx="260" cy="-230" r="20" fill="black"/>
      <circle cx="700" cy="-230" r="20" fill="black"/>
    </mask>
  </defs>

  <!-- pantograph poles -->
  <line x1="500" y1="-600" x2="20" y2="-750" stroke="#e3e3e3" stroke-width="34" stroke-linecap="round"/>
  <line x1="680" y1="-600" x2="200" y2="-750" stroke="#e3e3e3" stroke-width="34" stroke-linecap="round"/>
  <rect x="500" y="-612" width="180" height="24" rx="12" fill="#e3e3e3"/>

  <!-- body + wheels (windows/hubs cut via mask) -->
  <g mask="url(#trolleybus-cutouts)">
    <path d="M90-600 H880 L900-430 L900-290 Q900-260 870-260 H90 Q60-260 60-290 V-570 Q60-600 90-600 Z"/>
    <circle cx="260" cy="-230" r="80"/>
    <circle cx="700" cy="-230" r="80"/>
  </g>
</svg>